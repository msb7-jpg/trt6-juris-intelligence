[project]
name = "shared"
version = "0.1.0"
description = "Shared schemas, clients and utilities for TRT6 project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "minio>=7.2.20",
    "celery>=5.6.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["shared*"]
namespaces = false
