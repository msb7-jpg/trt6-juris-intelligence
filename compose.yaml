services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: trt6
      POSTGRES_USER: trt6
      POSTGRES_PASSWORD: trt6
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trt6 -d trt6"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
      - "4369:4369"    # epmd (clustering)
      - "25672:25672"  # clustering communication
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: trt6
      POSTGRES_USER: trt6
      POSTGRES_PASSWORD: trt6
      CELERY_BROKER_URL: amqp://user:password@rabbitmq:5672//
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_SECURE: "false"
      API_URL: http://api:8000/api/processos/deduplicar/
      PENDING_API_URL: http://api:8000/api/processos/nao_possuem_pdf/
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/').getcode()"]      
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app/apps/api
          ignore:
            - "**/__pycache__/"
            - "**/.venv/"
            - "**/migrations/"
        - action: rebuild
          path: ./shared
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock

  worker-scrapper:
    build:
      context: .
      dockerfile: apps/worker-scrapper/Dockerfile
    environment:
      CELERY_BROKER_URL: amqp://user:password@rabbitmq:5672//
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_SECURE: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    develop:
      watch:
        - action: sync+restart
          path: ./apps/worker-scrapper
          target: /app/apps/worker-scrapper
          ignore:
            - "**/__pycache__/"
            - "**/.venv/"
        - action: rebuild
          path: ./shared
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock

  worker-llm:
    build:
      context: .
      dockerfile: apps/worker-llm/Dockerfile
    environment:
      CELERY_BROKER_URL: amqp://user:password@rabbitmq:5672//
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_SECURE: "false"
      LMSTUDIO_API_URL: http://host.docker.internal:1234/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    develop:
      watch:
        - action: sync+restart
          path: ./apps/worker-llm
          target: /app/apps/worker-llm
          ignore:
            - "**/__pycache__/"
            - "**/.venv/"
        - action: rebuild
          path: ./shared
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock

  ingestion:
    build:
      context: .
      dockerfile: apps/ingestion/Dockerfile
    environment:
      CELERY_BROKER_URL: amqp://user:password@rabbitmq:5672//
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_SECURE: "false"
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    develop:
      watch:
        - action: sync+restart
          path: ./apps/ingestion
          target: /app/apps/ingestion
          ignore:
            - "**/__pycache__/"
            - "**/.venv/"
        - action: rebuild
          path: ./docker/cron/ingestion.crontab
        - action: rebuild
          path: ./shared
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock

  search-notifier:
    build:
      context: .
      dockerfile: apps/search-notifier/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: trt6
      POSTGRES_USER: trt6
      POSTGRES_PASSWORD: trt6
      POSTGRES_PORT: "5432"
      API_BASE_URL: http://api:8000
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER: ${SMTP_SENDER:-}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
